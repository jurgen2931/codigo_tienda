<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Online</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <header>
    <h1>PRODUCTS HUB</h1>
    <nav>
      <ul>

        <a href="login.html">Login</a>
        <a href="Categoria.html">Categoria</a>
        <a href="Contacto.html">Contacto</a>
        <a href="Carrito.html">Carrito</a>

      </ul>
    </nav>
  </header>


  <section id="Login" class="banner">
    <img src="img/logo.jpg" alt="icono carrito" class="icono">
    <div class="texto">
      <h2>CENTRO DE PRODUCTOS</h2>
      <p>Tu mundo, tus productos, a un clic</p>
    </div>
  </section>

 
  <section id="productos">
    <h2>Productos destacados</h2>
    <div class="productos-grid">
      <div class="producto">
        <img src="img/auriculares.jpg" alt="Auriculares Pro">
        <h3>Auriculares Pro</h3>
        <p>COP $99.000</p>
        <button>Ver detalles</button>
      </div>

      <div class="producto">
        <img src="img/Smartwatch.jpg" alt="Smartwatch">
        <h3>Smartwatch</h3>
        <p>COP $120.000</p>
        <button>Ver detalles</button>
      </div>

      <div class="producto">
        <img src="img/Altavosjbl.jpg" alt="Altavoz JBL">
        <h3>Altavoz JBL</h3>
        <p>COP $160.000</p>
        <button>Ver detalles</button>
      </div>

      <div class="producto">
        <img src="img/Dron.jpg" alt="Dron">
        <h3>Dron</h3>
        <p>COP $180.000</p>
        <button>Ver detalles</button>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
