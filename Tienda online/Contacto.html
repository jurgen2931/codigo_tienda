<!DOCTYPE html>

<body>
  <header>
    <div class="logo">
      <h1>PRODUCTS HUB</h1>

    <nav>

      <a href="Categoria.html">Categorías</a>

    <img src="img/logo_asesor.webp" alt="Asesor de atención al cliente" class="asesor">

  <main>
    <div class="texto-contacto">
      <h2>Contáctanos</h2>
      <p>Por favor complete el siguiente formulario para enviarnos un mensaje.</p>
      <p>¿Tienes dudas, sugerencias o necesitas ayuda con tu compra? Escríbenos y nuestro equipo te responderá lo más pronto posible.</p>

      <strong>Correo electrónico:</strong>
      <p>atencionusuario@productshub.com</p>
    </div>

    <form>
      <input type="text" placeholder="NOMBRE" required>
      <input type="email" placeholder="CORREO ELECTRÓNICO" required>
      <input type="text" placeholder="ASUNTO">
      <textarea placeholder="MENSAJE"></textarea>
      <button type="submit">ENVIAR</button>
    </form>
  </main>
