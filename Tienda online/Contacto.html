<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Products Hub</title>
  <link rel="stylesheet" href="contacto.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <header>
    <div class="logo">
      <h1>PRODUCTS HUB</h1>
    </div>

    <nav>
      <a href="index.html">Principal</a>
      <a href="Categoria.html">Categorías</a>
    </nav>

    <img src="img/logo_asesor.webp" alt="Asesor de atención al cliente" class="asesor">
  </header>

  <main>
    <div class="texto-contacto">
      <h2>Contáctanos</h2>
      <p>Por favor complete el siguiente formulario para enviarnos un mensaje.</p>
      <p>¿Tienes dudas, sugerencias o necesitas ayuda con tu compra? Escríbenos y nuestro equipo te responderá lo más pronto posible.</p>

      <strong>Correo electrónico:</strong>
      <p>atencionusuario@productshub.com</p>
    </div>

    <form>
      <input type="text" placeholder="NOMBRE" required>
      <input type="email" placeholder="CORREO ELECTRÓNICO" required>
      <input type="text" placeholder="ASUNTO">
      <textarea placeholder="MENSAJE"></textarea>
      <button type="submit">ENVIAR</button>
    </form>
  </main>
   <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <script>
    
    (function() {
      emailjs.init("DB2XPtZdbq33zcMkf");
    })();

    
    document.getElementById("contactForm").addEventListener("submit", function(e) {
      e.preventDefault();

      emailjs.sendForm("service_pipiaec", "template_fpn61rt", this)
      .then(() => {

        alert("Mensaje enviado correctamente!");

        
        window.location.href = "index.html";

      })
      .catch((error) => {
        alert("Hubo un error: " + JSON.stringify(error));
      });
    });
  </script>

</body>
</html>
